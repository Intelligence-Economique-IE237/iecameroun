# PostgreSQL pour le développement local uniquement.
# En production, la base est créée dans Coolify.
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ie237
      POSTGRES_PASSWORD: ie237
      POSTGRES_DB: ie237
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Crée aussi la base ie237_test au premier démarrage
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
